<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Password — Analisi Albero</title>
<!--
  ========================================================================
  PARCO IoT — nuova-password.html   v1 (03/08/2026)
  ========================================================================
  Pagina autonoma per il recupero della password. Serve DUE clienti con lo
  stesso lavoro: il form "Analisi Albero" e l'app FlutterFlow, che dal 26
  luglio ha il link "Password dimenticata?" scollegato.

  PERCHÉ SERVE
  Gli utenti si creano a mano e ricevono una password provvisoria. Finché
  gli utenti sono due, una password persa si risolve rigenerandola dal
  pannello. Appena entra una terza persona, quella telefonata arriva — e
  senza questa pagina l'unica risposta è "aspetta che te ne faccio un'altra".

  DUE MODI, UNA PAGINA
  1. Aperta normalmente → chiede l'email e fa partire il messaggio.
  2. Aperta dal link ricevuto per email → chiede la password nuova.
  Si distinguono da sole guardando l'indirizzo: Supabase ci attacca il
  lasciapassare temporaneo.

  ⚠️ DA FARE UNA VOLTA NEL PANNELLO SUPABASE, altrimenti il link non
  funziona: Authentication → URL Configuration → Redirect URLs → aggiungere
  l'indirizzo completo di questa pagina.

  ⚠️ La posta di Supabase ha un limite basso di messaggi all'ora. Per pochi
  utenti va bene; se un domani saranno molti, va configurato un servizio di
  posta proprio (Authentication → SMTP Settings).
  ========================================================================
-->
<style>
  :root { --verde:#15803d; --verde-scuro:#14532d; --grigio:#6b7280; --rosso:#b91c1c; }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#0f2419; padding:16px;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  .scheda {
    background:#fff; border-radius:14px; padding:26px 22px; width:100%; max-width:380px;
    box-shadow:0 10px 40px rgba(0,0,0,.35);
  }
  h1 { margin:0 0 4px; font-size:20px; color:var(--verde-scuro); }
  p.sott { margin:0 0 18px; font-size:13px; color:var(--grigio); line-height:1.5; }
  label { display:block; font-size:13px; color:#374151; margin:12px 0 4px; }
  input {
    width:100%; padding:11px 12px; border:1px solid #d1d5db; border-radius:9px; font-size:16px;
  }
  button {
    width:100%; margin-top:18px; padding:13px; border:0; border-radius:9px;
    background:var(--verde); color:#fff; font-size:16px; font-weight:600; cursor:pointer;
  }
  button:disabled { background:#9ca3af; cursor:default; }
  .msg { margin-top:14px; font-size:13px; min-height:18px; line-height:1.5; }
  .msg.ko { color:var(--rosso); }
  .msg.ok { color:var(--verde); }
  .torna { display:block; margin-top:18px; font-size:13px; color:var(--grigio); text-align:center; }
  .nota { margin-top:16px; font-size:12px; color:var(--grigio); line-height:1.5; }
</style>
</head>
<body>
<div class="scheda" id="scheda">
  <h1>Un momento…</h1>
  <p class="sott">Lettura dell'indirizzo.</p>
</div>

<script>
(function () {
  'use strict';

  // ── DA RIEMPIRE UNA VOLTA SOLA ───────────────────────────────────────
  // Gli stessi due valori che stanno in cima ad accesso.js: copiali da lì.
  var SUPA_URL  = 'https://sldotadtisgekovgvsqr.supabase.co';
  var SUPA_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNsZG90YWR0aXNnZWtvdmd2c3FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxNjMzNDIsImV4cCI6MjA5OTczOTM0Mn0.A6B4nX33wH_DRBVVBCXquR-HNkK88qVPV2o5HKZa-xw';

  // Dove torna l'utente dopo aver cambiato la password. Se il form sta
  // altrove, correggi qui.
  var DOVE_TORNARE = 'Analisi_Albero.html';

  var scheda = document.getElementById('scheda');

  function chiama(percorso, opzioni) {
    var o = opzioni || {};
    var testate = { 'apikey': SUPA_ANON, 'Content-Type': 'application/json' };
    if (o.gettone) testate['Authorization'] = 'Bearer ' + o.gettone;
    return fetch(SUPA_URL.replace(/\/+$/, '') + percorso, {
      method: o.metodo || 'GET',
      headers: testate,
      body: o.corpo ? JSON.stringify(o.corpo) : undefined
    });
  }

  function disegna(html) { scheda.innerHTML = html; }

  function messaggio(testo, esito) {
    var m = document.getElementById('msg');
    if (m) { m.textContent = testo || ''; m.className = 'msg ' + (esito || ''); }
  }

  // ── Lettura dell'indirizzo ───────────────────────────────────────────
  // Supabase consegna il lasciapassare in tre forme diverse a seconda di
  // come è configurato il progetto. Si accettano tutte e tre invece di
  // scommettere su una: un errore qui si manifesterebbe solo il giorno in
  // cui qualcuno ha davvero perso la password, cioè nel momento peggiore.
  function daIndirizzo() {
    var hash = new URLSearchParams((location.hash || '').replace(/^#/, ''));
    var cerca = new URLSearchParams(location.search || '');
    return {
      gettone:   hash.get('access_token'),
      codice:    cerca.get('code'),
      tokenHash: cerca.get('token_hash') || cerca.get('token'),
      tipo:      hash.get('type') || cerca.get('type'),
      errore:    hash.get('error_description') || cerca.get('error_description')
    };
  }

  // ── MODO 1: chiedere il messaggio ────────────────────────────────────
  function schermataRichiesta(avviso) {
    disegna(
      '<h1>Password dimenticata</h1>' +
      '<p class="sott">Inserisci l\'indirizzo con cui accedi. ' +
      'Riceverai un messaggio con un collegamento per sceglierne una nuova.</p>' +
      '<label for="mail">Indirizzo email</label>' +
      '<input id="mail" type="email" autocomplete="username" autocapitalize="off" spellcheck="false">' +
      '<button id="invia">Invia il collegamento</button>' +
      '<div id="msg" class="msg ko">' + (avviso || '') + '</div>' +
      '<a class="torna" href="' + DOVE_TORNARE + '">Torna all\'accesso</a>'
    );

    var bott = document.getElementById('invia');
    var mail = document.getElementById('mail');

    async function invia() {
      var e = (mail.value || '').trim();
      if (!e) { messaggio('Inserisci il tuo indirizzo email.', 'ko'); return; }
      bott.disabled = true;
      messaggio('Invio in corso…', '');
      try {
        var dove = location.href.split('#')[0].split('?')[0];
        await chiama('/auth/v1/recover?redirect_to=' + encodeURIComponent(dove), {
          metodo: 'POST', corpo: { email: e }
        });
        // Volutamente si risponde allo stesso modo anche se l'indirizzo non
        // esiste: dire "questo utente non c'è" permetterebbe a chiunque di
        // scoprire chi ha un accesso al sistema.
        disegna(
          '<h1>Controlla la posta</h1>' +
          '<p class="sott">Se l\'indirizzo <b>' + e.replace(/[<>&]/g, '') + '</b> ' +
          'corrisponde a un accesso, fra poco riceverai un messaggio con il ' +
          'collegamento per scegliere la nuova password.<br><br>' +
          'Il collegamento vale un\'ora e si può usare una volta sola. ' +
          'Se non arriva, controlla la posta indesiderata.</p>' +
          '<a class="torna" href="' + DOVE_TORNARE + '">Torna all\'accesso</a>'
        );
      } catch (err) {
        messaggio('Invio non riuscito: ' + (err.message || 'rete assente') + '.', 'ko');
        bott.disabled = false;
      }
    }
    bott.addEventListener('click', invia);
    mail.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') invia(); });
    setTimeout(function () { mail.focus(); }, 60);
  }

  // ── MODO 2: scegliere la password nuova ──────────────────────────────
  function schermataNuova(gettone) {
    disegna(
      '<h1>Nuova password</h1>' +
      '<p class="sott">Scegli una password che non usi altrove. ' +
      'Almeno otto caratteri.</p>' +
      '<label for="p1">Nuova password</label>' +
      '<input id="p1" type="password" autocomplete="new-password">' +
      '<label for="p2">Ripetila</label>' +
      '<input id="p2" type="password" autocomplete="new-password">' +
      '<button id="salva">Salva</button>' +
      '<div id="msg" class="msg"></div>'
    );

    var bott = document.getElementById('salva');
    var p1 = document.getElementById('p1');
    var p2 = document.getElementById('p2');

    async function salva() {
      var a = p1.value || '', b = p2.value || '';
      if (a.length < 8) { messaggio('La password deve avere almeno otto caratteri.', 'ko'); return; }
      if (a !== b) { messaggio('Le due password non coincidono.', 'ko'); return; }

      bott.disabled = true;
      messaggio('Salvataggio…', '');
      try {
        var r = await chiama('/auth/v1/user', {
          metodo: 'PUT', gettone: gettone, corpo: { password: a }
        });
        var d = await r.json().catch(function () { return {}; });
        if (!r.ok) {
          var m = (d && (d.msg || d.message || d.error_description)) || '';
          throw new Error(m || 'operazione rifiutata');
        }
        disegna(
          '<h1>Fatto</h1>' +
          '<p class="sott">La password è stata cambiata. ' +
          'Ora puoi accedere con quella nuova.</p>' +
          '<a class="torna" href="' + DOVE_TORNARE + '">Vai all\'accesso</a>'
        );
      } catch (err) {
        messaggio('Non è stato possibile cambiare la password: ' +
                  (err.message || 'errore') + '. ' +
                  'Se il collegamento è scaduto, richiedine uno nuovo.', 'ko');
        bott.disabled = false;
      }
    }
    bott.addEventListener('click', salva);
    p2.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') salva(); });
    setTimeout(function () { p1.focus(); }, 60);
  }

  // ── Avvio ────────────────────────────────────────────────────────────
  async function avvia() {
    if (!SUPA_URL || !SUPA_ANON) {
      disegna('<h1>Configurazione incompleta</h1><p class="sott">In cima a questa ' +
              'pagina vanno inseriti l\'indirizzo del progetto e la chiave pubblica, ' +
              'gli stessi che stanno in accesso.js.</p>');
      return;
    }

    var d = daIndirizzo();

    if (d.errore) {
      schermataRichiesta('Il collegamento non è più valido: ' + d.errore + '. Richiedine uno nuovo.');
      return;
    }

    // Forma 1 — il lasciapassare arriva già pronto dopo il cancelletto.
    if (d.gettone) { schermataNuova(d.gettone); return; }

    // Forma 2 — arriva un codice da scambiare.
    if (d.codice) {
      try {
        var r = await chiama('/auth/v1/token?grant_type=pkce', {
          metodo: 'POST', corpo: { auth_code: d.codice }
        });
        var j = await r.json();
        if (r.ok && j.access_token) { schermataNuova(j.access_token); return; }
      } catch (e) {}
      schermataRichiesta('Il collegamento è scaduto o è già stato usato. Richiedine uno nuovo.');
      return;
    }

    // Forma 3 — arriva un gettone da verificare.
    if (d.tokenHash) {
      try {
        var r2 = await chiama('/auth/v1/verify', {
          metodo: 'POST', corpo: { type: 'recovery', token_hash: d.tokenHash }
        });
        var j2 = await r2.json();
        if (r2.ok && j2.access_token) { schermataNuova(j2.access_token); return; }
      } catch (e) {}
      schermataRichiesta('Il collegamento è scaduto o è già stato usato. Richiedine uno nuovo.');
      return;
    }

    // Nessuna delle tre: la pagina è stata aperta normalmente.
    schermataRichiesta('');
  }

  avvia();
})();
</script>
</body>
</html>
